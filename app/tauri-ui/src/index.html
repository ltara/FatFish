<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>肥鱼</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="risk-mask" class="risk-mask hidden" role="dialog" aria-modal="true">
    <div class="risk-card">
      <h1>风险告知</h1>
      <p>使用本客户端登录 QQ 存在账号安全与封号等风险。请仅使用<strong>专用小号</strong>，并自行保管 API Key。</p>
      <p>本软件为 Windows 本地客户端：Key 与对话数据默认保存在您的电脑，不提供云端代管。</p>
      <label class="check-row">
        <input type="checkbox" id="risk-ok" />
        <span>我已阅读并自愿承担上述风险</span>
      </label>
      <button id="risk-go" disabled>继续</button>
    </div>
  </div>

  <div class="app">
    <aside class="sidebar">
      <div class="brand">肥鱼</div>
      <nav>
        <button type="button" class="nav-btn active" data-page="status">状态</button>
        <button type="button" class="nav-btn" data-page="settings">设置</button>
        <button type="button" class="nav-btn" data-page="login">登录</button>
      </nav>
      <p class="sidebar-foot">Windows 本地客户端</p>
    </aside>

    <main class="content">
      <section id="page-status" class="page active">
        <h2>状态</h2>
        <ul class="status-list">
          <li>
            <span class="label">API Key</span>
            <span id="st-key" class="badge">检测中…</span>
          </li>
          <li>
            <span class="label">本机服务</span>
            <span id="st-svc" class="badge">检测中…</span>
          </li>
          <li>
            <span class="label">登录服务</span>
            <span id="st-login" class="badge">检测中…</span>
          </li>
        </ul>
        <p id="st-hint" class="hint"></p>
        <button type="button" id="btn-refresh" class="secondary">刷新状态</button>
      </section>

      <section id="page-settings" class="page">
        <h2>设置</h2>
        <p class="hint">DeepSeek API Key 仅保存在本机。保存后不会回显完整内容，请勿发给任何人。</p>
        <label class="field">
          DeepSeek API Key
          <input type="password" id="api-key" autocomplete="off" placeholder="sk-…" />
        </label>
        <p>
          <button type="button" id="btn-save-key">保存到本机</button>
        </p>
        <p id="settings-msg" class="hint"></p>
      </section>

      <section id="page-login" class="page">
        <h2>登录</h2>
        <div id="login-placeholder" class="placeholder hidden">
          <p>请先启动后台服务后再登录。</p>
          <p class="hint">可从安装目录运行「启动」脚本，或使用开始菜单中的肥鱼启动项。</p>
        </div>
        <div id="login-panel" class="login-panel hidden">
          <p class="hint">登录页在应用内打开，不会调用系统浏览器。</p>
          <div class="login-actions">
            <button type="button" id="btn-open-login">在应用内打开登录</button>
            <button type="button" id="btn-embed-login" class="secondary">尝试嵌入本页</button>
          </div>
          <iframe id="login-frame" class="login-frame hidden" title="登录" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
          <p id="login-msg" class="hint"></p>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
