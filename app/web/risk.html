<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>肥鱼 — 风险告知</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 36rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
    label { display: flex; gap: .5rem; align-items: flex-start; margin: 1.5rem 0; }
    button { padding: .5rem 1rem; }
    button:disabled { opacity: .4; }
  </style>
</head>
<body>
  <h1>风险告知</h1>
  <p>使用本客户端登录 QQ 存在账号安全与封号等风险。请仅使用<strong>专用小号</strong>，并自行保管 API Key。</p>
  <p>本软件为 Windows 本地客户端：Key 与对话数据默认保存在您的电脑，不提供云端代管。</p>
  <label>
    <input type="checkbox" id="ok" />
    <span>我已阅读并自愿承担上述风险</span>
  </label>
  <button id="go" disabled>继续</button>
  <script>
    const ok = document.getElementById("ok");
    const go = document.getElementById("go");
    ok.addEventListener("change", () => { go.disabled = !ok.checked; });
    go.addEventListener("click", () => {
      localStorage.setItem("fatfish_risk_ok", "1");
      location.href = "settings.html";
    });
  </script>
</body>
</html>
