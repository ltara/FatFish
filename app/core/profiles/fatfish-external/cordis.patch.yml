# No host-facing tools. Check the REAL request tools[] in dev/e2e.mjs after any edit.
# These IDs were taken from rc2 --dump-config, not master documentation.
- insert:
    - id: fatfish-memory
      name: './plugins/fatfish-memory.mjs'
    - id: fatfish-remind
      name: './plugins/fatfish-remind.mjs'
- id: sandbox-policy
  config:
    mode: read-only
- id: approval
  config:
    policy: ask
- id: tool-pwsh
  disabled: true
- id: tool-bash
  disabled: true
- id: pwsh-sandbox
  disabled: true
- id: bash-sandbox
  disabled: true
- id: shell-env
  disabled: true
