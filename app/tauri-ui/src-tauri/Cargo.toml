[package]
name = "tauri-ui"
version = "0.1.0"
description = "FatFish Windows desktop shell"
authors = ["FatFish"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "tauri_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# Pin <2.12: box rustc is 1.85; tauri 2.12+ needs 1.90. Win CI can bump later.
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.6", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
